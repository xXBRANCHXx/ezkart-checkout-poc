<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>Sign in to Ezkart</title>
</head>
<body style="margin:0;padding:0;background:#f7f7f8;color:#111827;font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">
    Use this secure link to sign in to Ezkart.
  </div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#f7f7f8;">
    <tr>
      <td align="center" style="padding:48px 20px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:560px;background:#ffffff;">
          <tr>
            <td style="padding:40px 48px 30px;">
              <img src="https://test.ezkart.id/assets/ezkart-logo-email.png?v=2" width="128" height="53" alt="Ezkart" style="display:block;width:128px;height:auto;border:0;outline:none;text-decoration:none;">
            </td>
          </tr>
          <tr>
            <td style="padding:0 48px;">
              <div style="height:1px;background:#e5e7eb;font-size:0;line-height:0;">&nbsp;</div>
            </td>
          </tr>
          <tr>
            <td style="padding:36px 48px 16px;">
              <h1 style="margin:0 0 18px;color:#111827;font-size:28px;line-height:36px;font-weight:700;letter-spacing:-.4px;">Sign in to Ezkart</h1>
              <p style="margin:0;color:#4b5563;font-size:16px;line-height:25px;">Click the button below to securely sign in to your Ezkart admin account.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 48px 28px;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td align="center" bgcolor="#111827" style="border-radius:6px;">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 24px;color:#ffffff;font-size:15px;line-height:20px;font-weight:700;text-decoration:none;border-radius:6px;">Sign in to Ezkart</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:0 48px 38px;">
              <p style="margin:0 0 14px;color:#6b7280;font-size:13px;line-height:21px;">This link expires shortly and can only be used once.</p>
              <p style="margin:0;color:#6b7280;font-size:13px;line-height:21px;">If you didn&rsquo;t request this email, you can safely ignore it.</p>
            </td>
          </tr>
        </table>
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:560px;">
          <tr>
            <td style="padding:20px 48px 0;color:#9ca3af;font-size:12px;line-height:19px;">
              Ezkart &middot; <a href="mailto:support@ezkart.id" style="color:#6b7280;text-decoration:none;">support@ezkart.id</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
